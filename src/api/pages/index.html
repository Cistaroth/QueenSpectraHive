<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queen Spectra Hive</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icon.png">
</head>
<body>

  <svg id="hc-canvas" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="hc" x="0" y="0" width="102" height="117.76" patternUnits="userSpaceOnUse">
        <polygon points="34,0 17,29.44 -17,29.44 -34,0 -17,-29.44 17,-29.44"
                 fill="rgba(90,45,0,0.20)" stroke="rgba(196,122,0,0.42)" stroke-width="1.2"/>
        <polygon points="34,58.88 17,88.32 -17,88.32 -34,58.88 -17,29.44 17,29.44"
                 fill="rgba(90,45,0,0.20)" stroke="rgba(196,122,0,0.42)" stroke-width="1.2"/>
        <polygon points="34,117.76 17,147.2 -17,147.2 -34,117.76 -17,88.32 17,88.32"
                 fill="rgba(90,45,0,0.20)" stroke="rgba(196,122,0,0.42)" stroke-width="1.2"/>
        <polygon points="85,29.44 68,58.88 34,58.88 17,29.44 34,0 68,0"
                 fill="rgba(70,32,0,0.16)" stroke="rgba(196,122,0,0.42)" stroke-width="1.2"/>
        <polygon points="85,88.32 68,117.76 34,117.76 17,88.32 34,58.88 68,58.88"
                 fill="rgba(70,32,0,0.16)" stroke="rgba(196,122,0,0.42)" stroke-width="1.2"/>
        <polygon points="136,0 119,29.44 85,29.44 68,0 85,-29.44 119,-29.44"
                 fill="rgba(90,45,0,0.20)" stroke="rgba(196,122,0,0.42)" stroke-width="1.2"/>
        <polygon points="136,58.88 119,88.32 85,88.32 68,58.88 85,29.44 119,29.44"
                 fill="rgba(90,45,0,0.20)" stroke="rgba(196,122,0,0.42)" stroke-width="1.2"/>
        <polygon points="136,117.76 119,147.2 85,147.2 68,117.76 85,88.32 119,88.32"
                 fill="rgba(90,45,0,0.20)" stroke="rgba(196,122,0,0.42)" stroke-width="1.2"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#1a0c00"/>
    <rect width="100%" height="100%" fill="url(#hc)"/>
  </svg>

  <div class="overlay"></div>

  <div class="stage">
    <div class="upload-card">

      <!-- Bee Logo -->
      <svg class="bee-logo" width="160" height="105" viewBox="-25 0 160 105" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Antennae -->
        <path d="M49 8 Q40 2 28 0" stroke="#f5c842" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="26.5" cy="0" r="3" fill="#f5c842"/>
        <path d="M61 8 Q70 2 82 0" stroke="#f5c842" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="83.5" cy="0" r="3" fill="#f5c842"/>

        <!-- Head -->
        <ellipse cx="55" cy="20" rx="14" ry="13" fill="#2a1400" stroke="#f5c842" stroke-width="2"/>
        <circle cx="49" cy="18" r="2.2" fill="#f5c842" opacity="0.8"/>
        <circle cx="61" cy="18" r="2.2" fill="#f5c842" opacity="0.8"/>

        <!-- Wings -->
        <path d="M40 42 C30 28 -10 30 -15 42 C-10 54 30 56 40 42 Z"
              fill="rgba(245,200,66,0.20)" stroke="#e8970a" stroke-width="1.5"/>
        <path d="M70 42 C80 28 120 30 125 42 C120 54 80 56 70 42 Z"
              fill="rgba(245,200,66,0.20)" stroke="#e8970a" stroke-width="1.5"/>

        <!-- Striped body -->
        <defs>
          <clipPath id="stClip">
            <ellipse cx="55" cy="55" rx="18" ry="22"/>
          </clipPath>
        </defs>
        <ellipse cx="55" cy="55" rx="18" ry="22" fill="#f5c842"/>
        <g clip-path="url(#stClip)">
          <rect x="37" y="38" width="36" height="6" fill="#1a0c00"/>
          <rect x="37" y="49" width="36" height="6" fill="#1a0c00"/>
          <rect x="37" y="60" width="36" height="6" fill="#1a0c00"/>
          <rect x="37" y="71" width="36" height="6" fill="#1a0c00"/>
          <ellipse cx="44" cy="55" rx="6" ry="22" fill="rgba(0,0,0,0.12)"/>
          <ellipse cx="66" cy="55" rx="6" ry="22" fill="rgba(0,0,0,0.08)"/>
        </g>
        <ellipse cx="55" cy="55" rx="18" ry="22" fill="none" stroke="#1a0c00" stroke-width="1.6"/>
        <!-- Tip -->
        <path d="M48 75 Q55 88 62 75" fill="#c47a00" stroke="#8a4e00" stroke-width="1"/>
      </svg>

      <h1 class="card-title">Queen <em>Spectra</em> Hive</h1>

      <div class="quote-block">
        <span class="quote-mark open">&ldquo;</span>
        <p class="quote-text">Classifying Queen Bee Presence by Audio</p>
        <span class="quote-mark close">&rdquo;</span>
      </div>

      <div class="divider"></div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".wav,audio/wav,audio/x-wav" />
        <svg class="drop-icon" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1"  y="16" width="4" height="10" rx="2" fill="#e8970a"/>
          <rect x="8"  y="9"  width="4" height="24" rx="2" fill="#e8970a"/>
          <rect x="15" y="5"  width="4" height="32" rx="2" fill="#f5c842"/>
          <rect x="22" y="12" width="4" height="18" rx="2" fill="#e8970a"/>
          <rect x="29" y="7"  width="4" height="28" rx="2" fill="#f5c842"/>
          <rect x="36" y="14" width="4" height="14" rx="2" fill="#e8970a"/>
        </svg>
        <p class="drop-primary">Drop WAV file here</p>
        <p class="drop-secondary">or click to browse</p>
      </div>

      <div class="file-error" id="fileError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f08060" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="1" fill="#f08060"/>
        </svg>
        <span id="fileErrorMsg">Only .wav files are accepted</span>
      </div>

      <div class="audio-panel" id="audioPanel">
        <div class="audio-file-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8970a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
          <span class="audio-file-name" id="fileName">—</span>
          <span class="audio-file-size" id="fileSize"></span>
        </div>

        <div class="player-wrap">
          <div class="player-controls">
            <button class="play-btn" id="playBtn" aria-label="Play">
              <svg id="playIcon" width="14" height="14" viewBox="0 0 14 14" fill="none">
                <polygon points="2,1 13,7 2,13" fill="#1a0c00"/>
              </svg>
              <svg id="pauseIcon" width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:none">
                <rect x="2" y="1" width="4" height="12" rx="1" fill="#1a0c00"/>
                <rect x="8" y="1" width="4" height="12" rx="1" fill="#1a0c00"/>
              </svg>
            </button>
            <div class="progress-wrap" id="progressWrap">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-delete" id="deleteBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
            Delete
          </button>
          <button class="btn-upload" id="uploadBtn">Upload File</button>
        </div>
      </div>

      <p class="formats" id="formatsHint">WAV files only</p>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div class="loading-screen" id="loadingScreen">
    <div class="honeycomb-aura"></div>
    <div class="loading-bee-wrap">
      <svg class="loading-bee" width="100" height="80" viewBox="-25 0 160 105" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M49 8 Q40 2 28 0" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <circle cx="26.5" cy="0" r="3.5" fill="#f5c842"/>
        <path d="M61 8 Q70 2 82 0" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <circle cx="83.5" cy="0" r="3.5" fill="#f5c842"/>
        <ellipse cx="55" cy="20" rx="14" ry="13" fill="#2a1400" stroke="#f5c842" stroke-width="2"/>
        <circle cx="49" cy="18" r="2.2" fill="#f5c842" opacity="0.9"/>
        <circle cx="61" cy="18" r="2.2" fill="#f5c842" opacity="0.9"/>
        <path d="M40 42 C30 28 -10 30 -15 42 C-10 54 30 56 40 42 Z" fill="rgba(245,200,66,0.25)" stroke="#e8970a" stroke-width="1.5"/>
        <path d="M70 42 C80 28 120 30 125 42 C120 54 80 56 70 42 Z" fill="rgba(245,200,66,0.25)" stroke="#e8970a" stroke-width="1.5"/>
        <defs><clipPath id="lClip"><ellipse cx="55" cy="55" rx="18" ry="22"/></clipPath></defs>
        <ellipse cx="55" cy="55" rx="18" ry="22" fill="#f5c842"/>
        <g clip-path="url(#lClip)">
          <rect x="37" y="38" width="36" height="6" fill="#1a0c00"/>
          <rect x="37" y="49" width="36" height="6" fill="#1a0c00"/>
          <rect x="37" y="60" width="36" height="6" fill="#1a0c00"/>
          <rect x="37" y="71" width="36" height="6" fill="#1a0c00"/>
        </g>
        <ellipse cx="55" cy="55" rx="18" ry="22" fill="none" stroke="#1a0c00" stroke-width="1.6"/>
        <path d="M48 75 Q55 88 62 75" fill="#c47a00" stroke="#8a4e00" stroke-width="1"/>
      </svg>
    </div>
    <p class="loading-title">Analysing the hive…</p>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="result-screen" id="resultScreen">
    <div class="result-card" id="resultCard">

      <!-- Radial confidence gauge wrapping the result icon -->
      <div class="result-gauge" id="resultGauge">
        <div class="result-glow" id="resultGlow"></div>
        <svg class="gauge-ring" viewBox="0 0 160 160" aria-hidden="true">
          <circle class="gauge-track" cx="80" cy="80" r="70" fill="none"/>
          <circle class="gauge-fill" id="gaugeFill" cx="80" cy="80" r="70" fill="none"
                  transform="rotate(-90 80 80)"/>
        </svg>
        <div class="result-icon-wrap" id="resultIconWrap"></div>
      </div>

      <p class="result-label" id="resultLabel"></p>
      <h2 class="result-headline" id="resultHeadline"></h2>
      <p class="result-sub" id="resultSub"></p>

      <!-- Probability readout -->
      <div class="confidence-readout" id="confidenceReadout">
        <span class="confidence-pct" id="confidencePct">0%</span>
        <span class="confidence-cap">Queen presence probability</span>
      </div>

      <div class="result-divider"></div>
      <div class="result-detail" id="resultDetail">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8970a" stroke-width="1.8" stroke-linecap="round" id="resultDetailIcon">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
        </svg>
        <p class="result-detail-text" id="resultDetailText"></p>
      </div>
      <button class="btn-again" id="btnAgain">Analyse Another File</button>
    </div>
  </div>

  <audio id="audioEl"></audio>
  <script src="app.js"></script>
</body>
</html>
